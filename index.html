<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blurt Community Page</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body { background-color: #f8f9fa; }
    .banner { height: 250px; background: url('https://quatrorodas.abril.com.br/wp-content/uploads/2019/02/dc5aeab5-ferrari-f8-tributo-1.jpg') center/cover; border-radius: 10px; }
    .subscribe-btn { background-color: #d40000; color: white; border: none; }
    .subscribe-btn:hover { background-color: #b00000; }
    .member-avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; margin-right: 10px; }
  </style>
</head>
<body>
  <div class="container my-4">
    <div class="row g-4">
      <!-- Sidebar Esquerdo -->
      <aside class="col-lg-3">
        <div class="card shadow-sm">
          <img src="https://upload.wikimedia.org/wikipedia/sco/thumb/d/d1/Ferrari-Logo.svg/344px-Ferrari-Logo.svg.png" class="card-img-top p-3" alt="Logo">
          <div class="card-body">
            <h5 id="community-name" class="card-title">Loading...</h5>
            <p id="community-tagline" class="text-muted"></p>
            <button class="btn subscribe-btn w-100 mb-3">SUBSCRIBE</button>
            <p><i class="bi bi-globe"></i> <a id="community-website" href="#">—</a></p>
            <p><strong>About:</strong><br><span id="community-desc">Loading...</span></p>
          </div>
        </div>
        <div class="card shadow-sm mt-3">
          <div class="card-body">
            <h6 class="text-uppercase text-muted mb-3">Community Stats</h6>
            <ul class="list-group list-group-flush" id="community-stats">
              <li class="list-group-item"><i class="bi bi-people"></i> Members: <span id="stat-members">—</span></li>
              <li class="list-group-item"><i class="bi bi-journal"></i> Posts: <span id="stat-posts">—</span></li>
              <li class="list-group-item"><i class="bi bi-person-check"></i> Subscribers: <span id="stat-subs">—</span></li>
            </ul>
          </div>
        </div>
      </aside>

      <!-- Conteúdo Principal -->
      <main class="col-lg-6">
        <div class="banner mb-3"></div>
        <ul class="nav nav-tabs" id="mainTabs">
          <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#posts">Posts</button></li>
          <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#forum">Forum</button></li>
          <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#poll">Poll</button></li>
          <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#shorts">Shorts</button></li>
        </ul>
        <div class="tab-content border border-top-0 p-3 bg-white rounded-bottom shadow-sm">
          <div id="posts" class="tab-pane fade show active">
            <div id="posts-list" class="list-group"></div>
          </div>
          <div id="forum" class="tab-pane fade">
            <div id="forum-list" class="list-group"></div>
          </div>
          <div id="poll" class="tab-pane fade">
            <div id="poll-list" class="list-group"></div>
          </div>
           <div id="shorts" class="tab-pane fade">
            <div id="shorts-list" class="list-group"></div>
          </div>
        </div>
      </main>

      <!-- Sidebar Direito -->
      <aside class="col-lg-3">
        <div class="card shadow-sm p-3">
          <h5>Share your moment!</h5>
          <button class="btn subscribe-btn w-100 mb-3">Blurt It</button>
        </div>
        <div class="card shadow-sm p-3">
           <h6>Members Rank</h6>
          <div id="members" class="mt-2"></div>
        </div>
      </aside>
    </div>
  </div>

  <script>
    const RPC_URL = 'https://rpc.blurt.world';

    async function rpcCall(method, params = {}, id = 1) {
      const res = await fetch(RPC_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ jsonrpc: '2.0', method, params, id })
      });
      const json = await res.json();
      return json.result;
    }

    async function loadCommunity() {
      const data = await rpcCall('bridge.get_community', { name: 'blurt-143557' });
      //bridge.list_subscribers
      const member = await rpcCall('bridge.list_subscribers', { community: 'blurt-143557',  "limit": 100 });
      if (!data) return;
      document.getElementById('community-name').textContent = data.title || data.name;
      document.getElementById('community-tagline').textContent = data.about || '';
      document.getElementById('community-website').href = data.url || '#';
      document.getElementById('community-website').textContent = data.url || '—';
      document.getElementById('community-desc').textContent = data.description || data.about || '';
      document.getElementById('stat-members').textContent = data.num_authors || '—';
      document.getElementById('stat-posts').textContent = data.num_pending || '—';
      document.getElementById('stat-subs').textContent = data.subscribers || '—';

      console.log(member);

      //data.subscribers_list
      if (member) {
        const membersDiv = document.getElementById('members');
        membersDiv.innerHTML = member.map(u => `
          <div class='d-flex align-items-center mb-2'>
            <img class='member-avatar' src='https://imgp.blurt.world/profileimage/${u[0]}/avatar' alt='${u[0]}'>
            <span>@${u[0]}</span>
          </div>`).join('');
      }
    }

    const postagensString = localStorage.getItem('allposts1');
    // Armazenamentos para tags secundárias
    let discussionPosts = postagensString ? (JSON.parse(postagensString).filter(post => post.json_metadata?.tags?.[1] === 'discussion') || []) : [];
    let peacePosts = postagensString ? (JSON.parse(postagensString).filter(post => post.json_metadata?.tags?.[1] === 'peace') || []) : [];

    async function loadPostsByTag(tag, containerId) {

      let postsToDisplay = [];
      let allPosts = []; // Para armazenar o resultado da API ou do localStorage

      // 1. Tenta carregar as postagens do localStorage para a tag principal
      if (postagensString) {
        allPosts = JSON.parse(postagensString); // CONVERTE STRING JSON para ARRAY
        console.log('Posts carregados do localStorage:', allPosts);
      } 
      
      // 2. Se não houver no localStorage (ou não for a tag principal), chama a API
      if (allPosts.length === 0) {
        // A tag principal é quem fará a requisição
        if (tag === 'blurt-143557') {
            allPosts = await rpcCall('bridge.get_ranked_posts', { sort: 'created', tag, limit: 100 });
            console.log('Posts carregados da API:', allPosts);
            // SALVA como STRING JSON no localStorage
            localStorage.setItem('allposts1', JSON.stringify(allPosts));
        }
      }

      // 3. Filtra e exibe os posts com base na tag solicitada
      if (allPosts.length > 0) {
          if (tag === 'blurt-143557') {
              postsToDisplay = allPosts;
                            console.log('postsToDisplay');
              console.log(postsToDisplay);
          } else {
              // Filtra o array principal em memória para tags secundárias
              postsToDisplay = allPosts.filter(post => post.json_metadata?.tags?.[0] === tag);
              //postsToDisplay = allPosts.filter(post => post.json_metadata?.tags?.includes(tag));
              allPosts[0].json_metadata.tags
              console.log('postsToDisplayddddddd');
              console.log(postsToDisplay);
          }
      }

      // Se for a primeira vez, armazena as listas de discussion e peace no localStorage separadamente
      if (!postagensString && allPosts.length > 0) {
          discussionPosts = allPosts.filter(post => post.json_metadata?.tags?.[0] === 'discussion');
          peacePosts = allPosts.filter(post => post.json_metadata?.tags?.[0] === 'peace');
          // Opcional: Salvar separadamente se quiser buscar diretamente depois, mas o filtro acima é mais eficiente
          localStorage.setItem('discussion', JSON.stringify(discussionPosts));
          localStorage.setItem('peace', JSON.stringify(peacePosts));

          console.log('weqrqwerwerew');
      }


      // 4. Renderiza a lista
      const list = document.getElementById(containerId);
      list.innerHTML = '';
      
      postsToDisplay.forEach(post => {
        const item = document.createElement('a');
        item.className = 'list-group-item list-group-item-action d-flex gap-3 align-items-center';
        // Uso seguro de optional chaining (?) para evitar erros se a metadata for nula
        const image = post.json_metadata?.image?.[0] || 'https://blurt.blog/images/placeholder.png';
        item.innerHTML = `
          <img src='${image}' width='80' height='60' class='rounded'>
          <div><h6 class='mb-1'>${post.title}</h6><small class='text-muted'>by @${post.author}</small></div>`;
        list.appendChild(item);
      });
    }

    // Seu código de execução, chamando as funções
    loadCommunity();

(async () => {
        // 1. CARREGAR a tag principal, esperar que ela termine (e salve no localStorage, se necessário)
        await loadPostsByTag('blurt-143557', 'posts-list');

        // 2. Agora que os dados estão carregados/salvos, carregar as tags secundárias
        loadPostsByTag('discussion', 'forum-list');
        loadPostsByTag('peace', 'poll-list');
        loadPostsByTag('ai', 'shorts-list');
    })();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
