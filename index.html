<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blurt Community Page</title>
<meta http-equiv="Content-Security-Policy" content="
    default-src 'self'; 
    script-src 'self' https://cdn.jsdelivr.net 'unsafe-inline';
    style-src 'self' https://cdn.jsdelivr.net 'unsafe-inline';
    font-src https://cdn.jsdelivr.net; 
    img-src https://imgp.blurt.world * data:;
    connect-src 'self' https://rpc.blurt.world;
  ">
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css"> 
</head>
<body>
  <div class="container my-4">
    <div class="row g-4">
      <aside class="col-lg-3">
        <div class="card shadow-sm">
          <img src="https://upload.wikimedia.org/wikipedia/sco/thumb/d/d1/Ferrari-Logo.svg/344px-Ferrari-Logo.svg.png" class="card-img-top p-3" alt="Logo">
          <div class="card-body">
            <h5 id="community-name" class="card-title">Loading...</h5>
            <p id="community-tagline" class="text-muted"></p>
            <button class="btn subscribe-btn w-100 mb-3">SUBSCRIBE</button>
            <p><i class="bi bi-globe"></i> <a id="community-website" href="#">—</a></p>
            <p><strong>About:</strong><br><span id="community-desc">Loading...</span></p>
          </div>
        </div>
        <div class="card shadow-sm mt-3">
          <div class="card-body">
            <h6 class="text-uppercase text-muted mb-3">Community Stats</h6>
            <ul class="list-group list-group-flush" id="community-stats">
              <li class="list-group-item"><i class="bi bi-people"></i> Members: <span id="stat-members">—</span></li>
              <li class="list-group-item"><i class="bi bi-journal"></i> Posts: <span id="stat-posts">—</span></li>
              <li class="list-group-item"><i class="bi bi-person-check"></i> Subscribers: <span id="stat-subs">—</span></li>
            </ul>
          </div>
        </div>
      </aside>

      <main class="col-lg-6">
        <div class="banner mb-3"></div>
        <ul class="nav nav-tabs" id="mainTabs">
          <li class="nav-item"><a class="nav-link" href="#posts" data-tab-id="posts">Posts</a></li>
          <li class="nav-item"><a class="nav-link" href="#forum" data-tab-id="forum">Forum</a></li>
          <li class="nav-item"><a class="nav-link" href="#poll" data-tab-id="poll">Poll</a></li>
          <li class="nav-item"><a class="nav-link" href="#shorts" data-tab-id="shorts">Shorts</a></li>
        </ul>
        <div class="tab-content border border-top-0 p-3 bg-white rounded-bottom shadow-sm">
          <div id="posts" class="tab-pane fade">
            <div id="posts-list" class="list-group"></div>
            <div id="infinite-scroll-loading" class="text-center p-3" style="display: none;">
                <i class="bi bi-arrow-clockwise h4 spin text-muted"></i>
            </div>
          </div>
          <div id="forum" class="tab-pane fade">
            <div id="forum-list" class="list-group"></div>
          </div>
          <div id="poll" class="tab-pane fade">
            <div id="poll-list" class="list-group"></div>
          </div>
           <div id="shorts" class="tab-pane fade">
            <div id="shorts-list" class="list-group"></div>
          </div>
        </div>
      </main>

      <aside class="col-lg-3">
        <div class="card shadow-sm p-3">
          <h5>Share your moment!</h5>
          <button class="btn subscribe-btn w-100 mb-3">Blurt It</button>
        </div>
        <div class="card shadow-sm p-3">
           <h6>Members Rank</h6>
          <div class="mb-3">
            <input type="text" class="form-control" id="member-search" placeholder="Buscar membro...">
          </div>
          <div id="members-scroll-container" class="mt-2">
            <div id="members"></div>
          </div>
        </div>
      </aside>
    </div>
  </div>

  <div class="modal fade" id="postModal" tabindex="-1" aria-labelledby="postModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="postModalLabel">Loading Post...</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div id="modal-post-content">
             <div class="text-center p-5 text-muted"><i class="bi bi-arrow-clockwise h4 spin"></i> Carregando conteúdo...</div>
          </div>
          <hr>
          <div id="modal-post-footer" class="d-flex justify-content-between text-muted">
            <small id="modal-post-author"></small>
            <small>
              <i class="bi bi-hand-thumbs-up"></i> <span id="modal-post-votes">0</span> |
              <i class="bi bi-chat"></i> <span id="modal-post-comments">0</span>
            </small>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script> 
  <script type="module" src="config.js"></script>
  <script type="module" src="utils.js"></script>
  <script type="module" src="app.js"></script> 
</body>
</html>
